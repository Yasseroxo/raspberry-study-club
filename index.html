<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raspberry Study Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="berry" viewBox="0 0 32 32">
      <g fill="currentColor">
        <circle cx="12" cy="12" r="2.4"/><circle cx="16" cy="12" r="2.4"/><circle cx="20" cy="12" r="2.4"/>
        <circle cx="10" cy="16" r="2.4"/><circle cx="14" cy="16" r="2.4"/><circle cx="18" cy="16" r="2.4"/><circle cx="22" cy="16" r="2.4"/>
        <circle cx="12" cy="20" r="2.4"/><circle cx="16" cy="20" r="2.4"/><circle cx="20" cy="20" r="2.4"/>
        <circle cx="14" cy="24" r="2.4"/><circle cx="18" cy="24" r="2.4"/>
      </g>
      <g fill="#fff" opacity=".35"><circle cx="11.4" cy="11.4" r=".8"/><circle cx="15.4" cy="11.4" r=".8"/><circle cx="19.4" cy="11.4" r=".8"/><circle cx="9.4" cy="15.4" r=".8"/><circle cx="13.4" cy="15.4" r=".8"/><circle cx="17.4" cy="15.4" r=".8"/><circle cx="11.4" cy="19.4" r=".8"/><circle cx="15.4" cy="19.4" r=".8"/></g>
      <path d="M16 9.2C14 5 10.6 4.4 8.6 5.6c1.6 2.4 4.6 3.6 7.4 3.6Z" fill="var(--leaf)"/>
      <path d="M16 9.2c2-4.2 5.4-4.8 7.4-3.6-1.6 2.4-4.6 3.6-7.4 3.6Z" fill="var(--leaf)"/>
    </symbol>
    <symbol id="stamp" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="3"/>
      <circle cx="60" cy="60" r="37" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path id="stamp-arc" d="M60 60m-47 0a47 47 0 1 1 94 0a47 47 0 1 1-94 0" fill="none"/>
      <text font-family="DM Mono, monospace" font-size="9.5" font-weight="500" fill="currentColor"><textPath href="#stamp-arc" textLength="290" lengthAdjust="spacing">RASPBERRY CRIMES UNIT · CASE CLOSED ·</textPath></text>
      <use href="#berry" x="41" y="41" width="38" height="38"/>
    </symbol>
  </defs>
</svg>

<div class="shell" id="shell">
  <aside class="side" aria-label="Sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg class="berry"><use href="#berry"/></svg></span>
      <div><b id="brand-name"></b><small id="brand-sub"></small></div>
    </div>
    <nav class="nav" id="side-nav" aria-label="Main"></nav>
    <div class="side-foot">
      <div class="save-state" data-save></div>
      <button class="btn ghost sm" data-act="theme-toggle" type="button" data-theme-btn></button>
      <button class="btn ghost sm" data-act="open-settings" type="button"></button>
    </div>
  </aside>

  <div class="main-col" style="min-width:0">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg class="berry"><use href="#berry"/></svg></span>
        <div><b id="brand-name-m"></b></div>
      </div>
      <div class="tb-right">
        <div class="save-state" data-save></div>
        <button class="icon-btn" data-act="theme-toggle" type="button" data-theme-btn data-icon-only></button>
        <button class="icon-btn" data-act="open-settings" type="button" aria-label="Open settings" id="tb-settings"></button>
      </div>
    </header>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
</div>

<button class="btn ghost sm exit-focus" type="button" data-act="focus-mode" id="exit-focus">Exit focus mode (Esc)</button>
<button class="fab" type="button" data-act="quick-add" aria-label="Quick add" id="fab"></button>
<nav class="bottom-nav" id="bottom-nav" aria-label="Main mobile"></nav>
<div id="modal-root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
